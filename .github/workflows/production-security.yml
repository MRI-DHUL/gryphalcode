name: Production Security Verification

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:
    inputs:
      target_url:
        description: Production URL to verify
        required: false
        default: https://gryphalcode.com
        type: string

permissions:
  contents: read

env:
  DEFAULT_TARGET_URL: https://gryphalcode.com

jobs:
  verify:
    name: Verify production security posture
    runs-on: ubuntu-latest
    steps:
      - name: Select target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target_url }}
        run: |
          target="${INPUT_TARGET:-$DEFAULT_TARGET_URL}"
          case "$target" in
            https://*) ;;
            *) echo "Target must use HTTPS: $target"; exit 1 ;;
          esac
          echo "url=$target" >> "$GITHUB_OUTPUT"

      - name: Verify HTTPS and security headers
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          curl --fail --silent --show-error --location --max-redirs 5 \
            --dump-header "$headers" --output "$body" "$TARGET_URL/"

          grep -qi '^HTTP/.* 200' "$headers" || { echo 'Production root did not return HTTP 200'; exit 1; }
          grep -qi '^strict-transport-security:' "$headers" || { echo 'Missing HSTS'; exit 1; }
          grep -qi '^content-security-policy:' "$headers" || { echo 'Missing CSP'; exit 1; }
          grep -qi '^x-content-type-options: nosniff' "$headers" || { echo 'Missing X-Content-Type-Options'; exit 1; }
          grep -qi '^x-frame-options: DENY' "$headers" || { echo 'Missing X-Frame-Options'; exit 1; }
          grep -qi '^referrer-policy:' "$headers" || { echo 'Missing Referrer-Policy'; exit 1; }
          grep -qi '^permissions-policy:' "$headers" || { echo 'Missing Permissions-Policy'; exit 1; }
          grep -qi '^cross-origin-opener-policy:' "$headers" || { echo 'Missing COOP'; exit 1; }
          grep -qi '^cross-origin-resource-policy:' "$headers" || { echo 'Missing CORP'; exit 1; }

      - name: Verify public security and SEO files
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          for path in /robots.txt /sitemap.xml /.well-known/security.txt; do
            echo "Checking $path"
            curl --fail --silent --show-error --location --max-redirs 5 \
              --output /dev/null "$TARGET_URL$path"
          done

      - name: Verify HTTPS redirect
        env:
          HOST: gryphalcode.com
        run: |
          set -euo pipefail
          headers=$(curl --silent --show-error --max-redirs 0 --dump-header - --output /dev/null "http://$HOST/" || true)
          printf '%s\n' "$headers" | grep -Eiq '^HTTP/.* 301|^HTTP/.* 302|^location: https://gryphalcode\.com/' \
            || { echo 'HTTP endpoint did not provide the expected HTTPS redirect'; exit 1; }
