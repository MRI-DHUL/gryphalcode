name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Collect build evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "GryphalCode CI build evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Generated dist files:"
            find dist -type f -print | sort 2>/dev/null || true
            echo
            echo "Prerendered HTML routes:"
            find dist -name index.html -print | sort 2>/dev/null || true
            echo
            echo "404 page:"
            test -f dist/404.html && echo "present" || echo "missing"
          } > evidence/build.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gryphalcode-build-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
