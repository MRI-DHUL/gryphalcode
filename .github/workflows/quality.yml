name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Check for accidental debug statements
        run: |
          if grep -RInE 'console\.log\(|debugger[[:space:];]' src --exclude='*.map'; then
            echo 'Debug statements found in src.'
            exit 1
          fi
      - name: Collect code-quality evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "GryphalCode code-quality evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Workflow result: ${{ job.status }}"
            echo
            echo "TypeScript project files:"
            find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print | sort
            echo
            echo "Debug statement scan:"
            if grep -RInE 'console\.log\(|debugger[[:space:];]' src --exclude='*.map'; then
              echo "FAIL: debug statements found"
            else
              echo "PASS: no console.log/debugger statements found"
            fi
          } > evidence/quality.txt
      - name: Upload code-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gryphalcode-quality-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
