name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Check for accidental debug statements
        run: |
          if grep -RInE 'console\.log\(|debugger[[:space:];]' src --exclude='*.map'; then
            echo 'Debug statements found in src.'
            exit 1
          fi
