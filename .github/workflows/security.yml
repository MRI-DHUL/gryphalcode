name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: npm audit
        run: |
          mkdir -p evidence
          set +e
          npm audit --audit-level=high --json > evidence/npm-audit.json
          status=$?
          set -e
          echo "npm audit exit code: $status" > evidence/npm-audit-status.txt
          exit "$status"
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gryphalcode-dependency-audit-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect secret-scan evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "Gitleaks evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Scan scope: full repository history"
            echo "Workflow result: ${{ job.status }}"
          } > evidence/gitleaks-summary.txt
      - name: Upload secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gryphalcode-secret-scan-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  semgrep:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript
      - name: Collect Semgrep evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "Semgrep evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Configuration: p/javascript"
            echo "Workflow result: ${{ job.status }}"
          } > evidence/semgrep-summary.txt
      - name: Upload Semgrep evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gryphalcode-semgrep-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v4
